name: Sonic Generations

# Recompiles Sonic Generations (Xbox 360) into portable C++ sources.
#
# The game executable cannot be stored in this repository. When you dispatch
# this workflow, just PASTE A DIRECT LINK to your legally dumped, DECRYPTED
# default.xex into the xex_source field, e.g.
#
#   https://example.com/files/default.xex   (any direct download URL)
#   https://drive.google.com/...            (Google Drive links work too)
#
# Alternatively you can use:
#   release:latest  - asset "default.xex" of the latest release of this repo
#                     (create a release in your fork and attach the file)
#   release:<tag>   - asset "default.xex" of the release with the given tag
#
# The generated C++ sources are uploaded as the "sonic-generations-ppc"
# artifact. See SonicGenerations/README.md for details.

on:
  workflow_dispatch:
    inputs:
      xex_source:
        description: "Paste a direct link to your decrypted default.xex (https://...). Google Drive links are supported. Alternatively: release:latest or release:<tag>"
        required: false
        default: ""

jobs:
  recompile:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build zip

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++

      - name: Build
        run: cmake --build build -j4

      - name: Fetch default.xex
        env:
          GH_TOKEN: ${{ github.token }}
          XEX_SOURCE: ${{ inputs.xex_source }}
        run: |
          set -euo pipefail
          cd SonicGenerations

          download_url() {
            local url="$1"
            echo "Downloading default.xex from: $url"
            if [[ "$url" == *drive.google.com* || "$url" == *docs.google.com* ]]; then
              pip install --quiet gdown
              gdown --fuzzy -O default.xex "$url" || {
                echo "::error::Google Drive download failed. Make sure the file is shared with 'Anyone with the link'."
                exit 1
              }
            else
              curl -fL --retry 3 -o default.xex "$url" || {
                echo "::error::Download failed. Make sure the link is a DIRECT download link to default.xex (it must return the file itself, not an HTML page)."
                exit 1
              }
            fi
          }

          case "$XEX_SOURCE" in
            "")
              echo "::error::No source was provided. Paste a direct link to your decrypted default.xex (https://...) into the xex_source field, or use release:latest / release:<tag>."
              exit 1
              ;;
            release:latest)
              gh release download --repo "$GITHUB_REPOSITORY" --pattern 'default.xex' --dir . || {
                echo "::error::No release asset named 'default.xex' was found in the latest release of this repository."
                echo "Create a release in your fork, attach your decrypted default.xex as an asset, and re-run,"
                echo "or simply paste a direct download link into the xex_source field."
                exit 1
              }
              ;;
            release:*)
              TAG="${XEX_SOURCE#release:}"
              gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'default.xex' --dir .
              ;;
            url:*)
              download_url "${XEX_SOURCE#url:}"
              ;;
            http://*|https://*)
              download_url "$XEX_SOURCE"
              ;;
            *)
              echo "::error::Unsupported xex_source '$XEX_SOURCE'. Paste a direct link starting with https:// (or http://), or use 'release:latest' / 'release:<tag>'."
              exit 1
              ;;
          esac

          # Sanity check: the file must look like a XEX2 (or ELF) executable.
          MAGIC="$(head -c 4 default.xex | od -An -tx1 | tr -d ' \n')"
          if [ "$MAGIC" != "58455832" ] && [ "$MAGIC" != "7f454c46" ]; then
            echo "::error::The downloaded file does not look like an Xbox 360 executable (expected XEX2 or ELF magic). Check the link: it must point directly at your decrypted default.xex."
            exit 1
          fi
          ls -la default.xex

      - name: Detect jump tables (XenonAnalyse)
        run: build/XenonAnalyse/XenonAnalyse SonicGenerations/default.xex SonicGenerations/switch_tables.toml

      - name: Recompile to C++ (XenonRecomp)
        shell: bash
        run: build/XenonRecomp/XenonRecomp SonicGenerations/config.toml XenonUtils/ppc_context.h 2>&1 | tee recompile.log

      - name: CRT helper detection summary
        run: grep -E "Auto-detected" recompile.log || echo "No CRT helpers were auto-detected (they may be pinned in config.toml)."

      - name: Package output
        run: |
          cd SonicGenerations
          test -d ppc
          zip -r -1 ../sonic-generations-ppc.zip ppc switch_tables.toml config.toml

      - name: Upload generated C++
        uses: actions/upload-artifact@v4
        with:
          name: sonic-generations-ppc
          path: sonic-generations-ppc.zip
          compression-level: 0
          if-no-files-found: error
